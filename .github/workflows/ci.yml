name: CI

# Stage SEC (APEX_MASTER_IMPLEMENTATION_PLAN §16A.2). Runs the project's
# `verify:pr` tier (§4.4.3: lint -> unit -> runtime -> build -> QA suites ->
# docs -> release gate) on every push/PR and blocks merge on failure. A
# registry mirror 404 must be a red check here, not a silently skipped step —
# see AUDIT_REPORT_v1.0.47 for why prior sessions could not execute this at
# all.
#
# Node matrix: package.json engines pins "node": ">=22 <25", so a 22.x check
# stays meaningful. Node 24.x is the sole authoritative full verify:pr runner;
# 22.x gets a narrow compatibility job (lint + test:unit only) instead of a
# second full run of the entire non-visual pipeline, which cost roughly twice
# the CI time for no evidence beyond the two cheapest gates ever differing by
# Node minor version. Generated-docs-drift enforcement lives in
# nightly.yml, not here — it's an assertion about the *committed* index
# files, not about whatever this PR's diff actually touches, so it belongs on
# a whole-repo cadence rather than blocking a PR that never came near
# Doc/FUNCTION_INDEX.* or Doc/DOCUMENTATION_INDEX.*.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR/branch instead of queuing stale ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify:pr (lint + unit + runtime + build + QA + docs + release-gate)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      # A registry mirror outage must fail the build, not be swallowed.
      - name: Install dependencies (npm ci)
        run: npm ci

      # Keep dependency-backed source/unit/runtime/build/release evidence in
      # this job. Browser and visual gates belong exclusively to verify-visual
      # below, where Chromium is installed explicitly.
      - name: verify:pr (non-visual pipeline)
        run: npm run verify:pr

      - name: npm audit (production dependencies, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload function index / audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apex-verify-artifacts-node-24.x
          path: |
            Doc/FUNCTION_INDEX.md
            Doc/FUNCTION_INDEX.json
            dist/server.cjs
          if-no-files-found: ignore
          retention-days: 14

  compat-node22:
    name: compat (lint + unit on Node 22.x, the floor of engines.node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: lint
        run: npm run lint

      - name: test:unit
        run: npm run test:unit

  dependency-review:
    name: dependency review (new vulnerable dependencies)
    runs-on: windows-latest
    # Pull requests only: the action compares the PR head against its base, so
    # there is no meaningful diff to review on a direct push to main.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Fails the check when a PR introduces a dependency with a known high or
      # critical advisory. The threshold matches `npm audit --audit-level=high`
      # in the verify job so the two do not disagree about what is acceptable.
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  verify-visual:
    name: verify:ui (Playwright browser + 1368x753 screenshot QA)
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # Both qa:ui-1368 (scripts/qa/verifyUi1368.mjs) and qa:workspace-runtime
      # (scripts/qa/verifyWorkspaceRuntime.mts) import the package-locked
      # JavaScript `playwright` package only — neither shells out to Python.
      # A Python interpreter + `pip install playwright` was previously
      # installed here for a `capture_apex_1368.py` legacy fixture
      # (`qa:ui-1368:legacy-fixture`) that this job does not run; removed.
      - name: Install JavaScript Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: verify:ui (build + qa:ui-1368 + qa:workspace-runtime)
        run: npm run verify:ui

      - name: Upload visual QA diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apex-visual-qa-artifacts
          path: |
            QA/**
            **/*-diff.png
            **/*-actual.png
          if-no-files-found: ignore
          retention-days: 14

