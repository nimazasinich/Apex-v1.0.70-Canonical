name: Export base snapshot
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  export:
    if: github.event.issue.title == 'APEX_EXPORT_BASE_SNAPSHOT'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source base
        uses: actions/checkout@v4
        with:
          repository: nimazasinich/Apex
          ref: main
          path: source
      - name: Remove git metadata
        run: rm -rf source/.git
      - name: Upload base snapshot
        uses: actions/upload-artifact@v4
        with:
          name: apex-base-snapshot
          path: source
          include-hidden-files: true
          retention-days: 1
