<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081410"/>
      <stop offset="50%" stop-color="#0a1815"/>
      <stop offset="100%" stop-color="#081410"/>
    </linearGradient>
    <linearGradient id="apexGreen" x1="9" y1="55" x2="48" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18BBAA"/>
      <stop offset="0.42" stop-color="#55C94B"/>
      <stop offset="1" stop-color="#A8E935"/>
    </linearGradient>
    <linearGradient id="apexGreen2" x1="25" y1="48" x2="53" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2CBF66"/>
      <stop offset="1" stop-color="#87DE35"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55C94B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#18BBAA" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lineGlow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7f5df"/>
    </linearGradient>
    <radialGradient id="vignette" cx="46%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#123a2c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#081410" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#vignette)"/>

  <!-- faint grid -->
  <g stroke="#173a2c" stroke-width="1" opacity="0.55">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="340" y1="0" x2="340" y2="340"/>
    <line x1="560" y1="0" x2="560" y2="340"/>
    <line x1="780" y1="0" x2="780" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
  </g>

  <!-- candlestick silhouette, far right -->
  <g opacity="0.55">
    <line x1="1010" y1="80" x2="1010" y2="135" stroke="#1f4d3a" stroke-width="2"/>
    <rect x="1002" y="90" width="16" height="30" fill="#2a6b4d"/>
    <line x1="1045" y1="95" x2="1045" y2="150" stroke="#1f4d3a" stroke-width="2"/>
    <rect x="1037" y="105" width="16" height="28" fill="#1f4d3a"/>
    <line x1="1080" y1="70" x2="1080" y2="120" stroke="#1f4d3a" stroke-width="2"/>
    <rect x="1072" y="78" width="16" height="26" fill="#2a6b4d"/>
    <line x1="1115" y1="85" x2="1115" y2="140" stroke="#1f4d3a" stroke-width="2"/>
    <rect x="1107" y="95" width="16" height="28" fill="#1f4d3a"/>
    <line x1="1150" y1="60" x2="1150" y2="110" stroke="#1f4d3a" stroke-width="2"/>
    <rect x="1142" y="68" width="16" height="26" fill="#2a6b4d"/>
  </g>

  <!-- rising price line (brand green) -->
  <polyline points="500,270 590,250 680,258 770,205 860,222 950,165 1040,182 1130,130 1200,110"
    fill="none" stroke="url(#lineGlow)" stroke-width="3.5" opacity="0.9"/>

  <!-- secondary line (blue) -->
  <polyline points="500,295 590,288 680,278 770,270 860,255 950,248 1040,232 1130,222 1200,205"
    fill="none" stroke="url(#lineGlow2)" stroke-width="2.5" opacity="0.55"/>

  <!-- APEX logo mark, scaled up -->
  <g transform="translate(80, 90) scale(2.7)">
    <path d="M5.7 52.2 24.9 11.4c1.2-2.6 3.8-4.2 6.7-4.2 2.8 0 5.4 1.6 6.7 4.1l20 40.9H46.2L31.7 22.4 18.4 52.2H5.7Z" fill="url(#apexGreen)"/>
    <path d="m20.2 52.2 10.9-23.7 7.1 14.6-4.3 9.1H20.2Z" fill="url(#apexGreen2)" opacity=".96"/>
    <path d="M31.5 7.2c2.9 0 5.6 1.7 6.9 4.4l2.3 4.7-9 6.1-6.8-10.2c1.2-3 3.7-5 6.6-5Z" fill="#A7E83A" opacity=".98"/>
  </g>

  <!-- wordmark -->
  <text x="245" y="175" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="4" fill="url(#textGrad)">APEX</text>

  <!-- accent underline -->
  <rect x="248" y="193" width="290" height="5" rx="2.5" fill="#55C94B"/>

  <!-- tagline -->
  <text x="248" y="230" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#a9c9bd">Supervised Crypto-Futures Trading &amp; Research Terminal</text>

  <!-- status chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">
    <rect x="248" y="250" width="150" height="30" rx="15" fill="#0f2820" stroke="#1f4d3a"/>
    <circle cx="266" cy="265" r="4" fill="#22c55e"/>
    <text x="278" y="270" fill="#c7e0d2">Live Market Data</text>

    <rect x="408" y="250" width="185" height="30" rx="15" fill="#0f2820" stroke="#1f4d3a"/>
    <circle cx="426" cy="265" r="4" fill="#A8E935"/>
    <text x="438" y="270" fill="#c7e0d2">Human-Approved Orders</text>
  </g>
</svg>
